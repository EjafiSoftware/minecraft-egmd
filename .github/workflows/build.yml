name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: EjafiSoftware/minecraft-build/.github/workflows/mod-gate.yml@v1.5.0
    permissions:
      contents: read
      packages: read

  codeql:
    if: github.ref == 'refs/heads/main'
    uses: EjafiSoftware/minecraft-build/.github/workflows/mod-codeql.yml@v1.5.0
    permissions:
      contents: read
      packages: read
      security-events: write

  release:
    if: github.ref_type == 'tag'
    needs: gate
    uses: EjafiSoftware/minecraft-build/.github/workflows/mod-release.yml@v1.5.0
    permissions:
      contents: write
    with:
      curseforge-project-id: ${{ vars.CURSE_PROJECT_ID }}
    secrets:
      CURSE_API_TOKEN: ${{ secrets.CURSE_API_TOKEN }}
