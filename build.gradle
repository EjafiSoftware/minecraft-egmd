import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'idea'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat(palantir_java_format_version)
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.testFixtures.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testFixtures.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.gameTest
    addModdingDependenciesTo sourceSets.testFixtures

    runs {
        client {
            client()
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            sourceSet = sourceSets.gameTest
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
            sourceSet(sourceSets.testFixtures)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

dependencies {
    implementation "org.jspecify:jspecify:${jspecify_version}"

    errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
    errorprone "com.uber.nullaway:nullaway:${nullaway_version}"

    gameTestImplementation "org.jspecify:jspecify:${jspecify_version}"
    gameTestImplementation "net.datafaker:datafaker:${datafaker_version}"
    additionalRuntimeClasspath "net.datafaker:datafaker:${datafaker_version}"
    testFixturesImplementation "org.jspecify:jspecify:${jspecify_version}"
    testFixturesImplementation "net.datafaker:datafaker:${datafaker_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation "org.assertj:assertj-core:${assertj_version}"
    testImplementation "net.datafaker:datafaker:${datafaker_version}"
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-XDaddTypeAnnotationsToSymbol=true')
    options.errorprone {
        check('NullAway', CheckSeverity.ERROR)
        option('NullAway:OnlyNullMarked', 'true')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
